name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky10, fedora45, ubuntu2404, debian13]
    name: e2e (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      - name: Start the ${{ matrix.distro }} host
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
          # The host container is privileged, so its firewall can load netfilter rules.
          PODMAN: sudo podman
        run: ./up.sh
      - name: Apply, then plan again with no changes
        working-directory: examples/local
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
          sudo podman exec circuit-firewall sh -c 'if command -v ufw >/dev/null; then ufw status | grep -qx "Status: active" && [ "$(ufw show added | grep -c "^ufw allow")" = 6 ]; else [ "$(firewall-cmd --list-ports)" = "22/tcp 80/tcp 443/tcp 60000-61000/udp" ] && firewall-cmd --list-rich-rules | grep -q 10.0.0.0/8 && firewall-cmd --list-rich-rules | grep -q 192.0.2.0/24; fi'
      # Every port tested has a listener behind it, so one that doesn't answer
      # was stopped by the firewall. 9100 opens to 10.0.0.0/8, which holds the
      # runner's bridge address; 9101 opens to 192.0.2.0/24, which doesn't.
      - name: Check allowed ports answer from outside the host, and the rest don't
        run: |
          ip=$(sudo podman inspect -f '{{.NetworkSettings.IPAddress}}' circuit-firewall)
          for p in 80 443 8081 9100 9101; do
            sudo podman exec circuit-firewall systemd-run --unit="listen-$p" systemd-socket-activate -l "$p" -a --inetd /bin/true
          done
          sleep 2
          reaches() { timeout 5 bash -c "exec 3<>/dev/tcp/$ip/$1" 2>/dev/null; }
          # On a failure, show what the host's firewall had loaded at that
          # moment, since a re-run rarely catches it again.
          state() {
            sudo podman exec circuit-firewall sh -c 'date -u +%T.%N; if command -v firewall-cmd >/dev/null; then systemctl status --no-pager firewalld | head -5; firewall-cmd --state; firewall-cmd --list-all; else ufw status verbose; fi; nft list ruleset' >&2 || true
          }
          check() {
            for p in 8081 9101; do sudo podman exec circuit-firewall bash -c "exec 3<>/dev/tcp/127.0.0.1/$p"; done
            for p in 80 443 9100; do reaches "$p" || { echo "port $p should answer" >&2; state; exit 1; }; done
            for p in 8081 9101; do if reaches "$p"; then echo "port $p should not answer" >&2; state; sleep 5; reaches "$p" && echo "still answers 5s later" >&2 || echo "shut 5s later" >&2; exit 1; fi; done
          }
          check
          sudo podman exec circuit-firewall sh -c 'if command -v firewall-cmd >/dev/null; then systemctl restart firewalld; else ufw reload; fi'
          check
      - name: Clean up
        if: always()
        working-directory: examples/local
        env:
          PODMAN: sudo podman
        run: ./down.sh

